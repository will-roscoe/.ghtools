[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ghtools"
dynamic = ["version"]
description = "Shared GitHub tooling for will-roscoe's repositories: CI, releases, docs and status, referenced rather than copied."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["jinja2>=3.1.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyyaml>=6", "actionlint-py==1.7.12.25"]

[project.scripts]
ghtools = "ghtools.cli:main"

[project.urls]
Homepage = "https://github.com/will-roscoe/.ghtools"

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.targets.wheel]
packages = ["src/ghtools"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures reproduce real workflow lines verbatim.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
