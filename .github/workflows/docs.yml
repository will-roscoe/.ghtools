name: ghtools docs
on:
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: $/.github/actions/setup-ghtools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: System packages
        run: |
          pkgs_out="$(ghtools config get docs.apt)"
          if [ -n "$pkgs_out" ]; then
            mapfile -t pkgs <<<"$pkgs_out"
            sudo apt-get update -qq
            sudo apt-get install -y -qq "${pkgs[@]}"
          fi
      - name: Install
        run: ghtools docs install
      - name: Build
        run: ghtools docs build
      - name: Docs gates
        id: gates
        run: |
          ghtools gates install --stage docs
          ghtools gates run --stage docs
      - id: html
        run: |
          dir="$(ghtools docs html-dir)"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: inputs.deploy
        with:
          path: ${{ steps.html.outputs.dir }}

      - name: Record docs status
        if: ${{ !cancelled() }}
        env:
          RESULT: ${{ job.status }}
          GATES: ${{ steps.gates.outcome }}
        run: ghtools status collect docs --result "$RESULT" --coverage-gate "$GATES" --out "$RUNNER_TEMP/status/docs.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ghtools-status-docs
          path: ${{ runner.temp }}/status/docs.json
          retention-days: 1

  deploy:
    needs: build
    if: inputs.deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
