name: ghtools python ci
on:
  workflow_call:
    inputs:
      matrix:
        description: JSON {"include":[{"python":..,"runner":..,"subproject"?:..}]} from `ghtools ci matrix`
        type: string
        required: true
      tests:
        description: false when the change selects no legs (the matrix then holds a placeholder)
        type: boolean
        default: true
      gates:
        description: run the test-stage gates in the first leg (umbrella repos run them in lint-ci)
        type: boolean
        default: true
      codecov:
        type: boolean
        default: false
      flags:
        type: string
        default: python-version
      docker:
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

permissions: {}

jobs:
  test:
    name: test (${{ matrix.subproject || matrix.python }}, ${{ matrix.runner }})
    if: inputs.tests
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/.github/actions/setup-ghtools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        env:
          SUBPROJECT: ${{ matrix.subproject }}
        run: |
          if [ -n "$SUBPROJECT" ]; then ghtools ci install --subproject "$SUBPROJECT"; else ghtools ci install; fi
      - name: Setup (subproject)
        # After install: python-dev's setup commands import the package.
        if: matrix.subproject
        env:
          SUBPROJECT: ${{ matrix.subproject }}
        run: ghtools ci setup --subproject "$SUBPROJECT"
      - name: Gates
        id: gates
        if: strategy.job-index == 0 && inputs.gates
        run: |
          ghtools gates install --stage test
          ghtools gates run --stage test
      - name: Test
        id: test
        # Runs even if a gate failed, so coverage and test results always report;
        # the failed gate still fails the job.
        if: ${{ !cancelled() }}
        env:
          SUBPROJECT: ${{ matrix.subproject }}
        run: |
          if [ -n "$SUBPROJECT" ]; then ghtools ci test --subproject "$SUBPROJECT"; else ghtools ci test; fi
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && inputs.codecov }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          flags: ${{ inputs.flags == 'subproject' && matrix.subproject || (inputs.flags == 'python-version' && format('py{0}', matrix.python) || '') }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && inputs.codecov }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          disable_search: true
          flags: ${{ inputs.flags == 'subproject' && matrix.subproject || (inputs.flags == 'python-version' && format('py{0}', matrix.python) || '') }}
      - name: Record status leg
        if: ${{ !cancelled() }}
        continue-on-error: true  # status must never fail CI
        env:
          PY: ${{ matrix.python }}
          RUNNER: ${{ matrix.runner }}
          OUTCOME: ${{ steps.test.outcome }}
          GATES: ${{ steps.gates.outcome }}
          CANONICAL: ${{ strategy.job-index == 0 }}
          SUBPROJECT: ${{ matrix.subproject }}
        run: |
          args=(--python "$PY" --runner "$RUNNER" --outcome "$OUTCOME" --gates-outcome "$GATES" --out "$RUNNER_TEMP/status-leg.json")
          if [ "$CANONICAL" = "true" ]; then args+=(--canonical); fi
          if [ -n "$SUBPROJECT" ]; then args+=(--subproject "$SUBPROJECT"); fi
          ghtools status leg "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: ghtools-status-leg-${{ matrix.python }}-${{ matrix.runner }}${{ matrix.subproject && format('-{0}', matrix.subproject) || '' }}
          path: ${{ runner.temp }}/status-leg.json
          retention-days: 1

  tests-passed:
    # One stable check name for branch protection: passes when every selected leg passed,
    # or when nothing needed testing (a docs-only change in an umbrella repo).
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "tests: $RESULT"
          [ "$RESULT" = success ] || [ "$RESULT" = skipped ]

  docker:
    if: inputs.docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t ghtools-ci .
