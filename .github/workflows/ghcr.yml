name: ghtools ghcr
# Builds the repository's Dockerfile at a released tag and pushes the image to
# ghcr.io/<owner>/<repo>, tagged with the version, its major.minor and (for a release
# that is not a prerelease) latest. Called by the stub's publish-ghcr job, which
# ghtools adds when release.publish includes "ghcr": that job, not this workflow,
# grants packages: write, so repositories that do not publish images never need it.
on:
  workflow_call:
    inputs:
      tag:
        description: the release tag to build, e.g. v2.17.2
        type: string
        required: true
      version:
        description: the release's version, e.g. 2.17.2
        type: string
        required: true
      platforms:
        description: comma-separated buildx platforms (release.platforms)
        type: string
        default: linux/amd64

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Build time
        id: when
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: inputs.platforms != 'linux/amd64'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=auto: only a version without a prerelease part moves latest.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Provenance a Dockerfile may declare as ARGs; one that does not ignores them.
          build-args: |
            GIT_DESCRIBE=${{ inputs.tag }}
            BUILD_DATE=${{ steps.when.outputs.date }}
