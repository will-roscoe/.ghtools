name: ghtools pipeline
on:
  workflow_call:
    inputs:
      dry-run:
        description: Compute the release without writing anything
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false
      DEPS_TOKEN:
        description: read-only token for private GitHub git dependencies (ci.private-deps)
        required: false
    outputs:
      dispatch:
        description: JSON list of workflow files commit directives asked to start
        value: ${{ jobs.config.outputs.dispatch }}
      released:
        value: ${{ jobs.release.outputs.released }}
      tag:
        value: ${{ jobs.release.outputs.tag }}
      version:
        value: ${{ jobs.release.outputs.version }}
      dist-artifact:
        value: ${{ jobs.release.outputs.dist-artifact }}

permissions: {}

jobs:
  config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      config: ${{ steps.export.outputs.config }}
      default-ref: ${{ steps.ref.outputs.default-ref }}
      would-release: ${{ steps.decide.outputs.released || 'false' }}
      # JSON rows of the released components due a release; '[]' (also without components).
      components: ${{ steps.components.outputs.components || '[]' }}
      run-ci: ${{ steps.reuse.outputs.reused == 'true' && 'false' || steps.paths.outputs.run-ci }}
      code-changed: ${{ steps.code.outputs.code-changed }}
      run-docs: ${{ steps.docs-paths.outputs.run-docs }}
      reused: ${{ steps.reuse.outputs.reused || 'false' }}
      codecov-day: ${{ steps.code.outputs.day }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
      dispatch: ${{ steps.directives.outputs.dispatch || '[]' }}
      # ci.select: JSON list of pytest markers this change leaves out; empty when the repo has no rules.
      deselect: ${{ steps.select.outputs.deselect }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: $/.github/actions/setup-ghtools
      - name: Validate and export settings
        id: export
        run: |
          ghtools config check
          config="$(ghtools config export --json)"
          echo "config=$config" >> "$GITHUB_OUTPUT"
      - name: Default branch?
        id: ref
        env:
          EVENT: ${{ github.event_name }}
        run: |
          branch="$(ghtools config get branch)"
          if [ "$EVENT" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/$branch" ]; then
            echo "default-ref=true" >> "$GITHUB_OUTPUT"
          else
            echo "default-ref=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Would this release?
        id: decide
        if: steps.ref.outputs.default-ref == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ghtools release decide --github-output
      - name: Would a component release?
        id: components
        if: steps.ref.outputs.default-ref == 'true' && fromJSON(steps.export.outputs.config).components
        env:
          GH_TOKEN: ${{ github.token }}
        run: ghtools release components decide --github-output
      - name: Commit directives
        id: directives
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: ghtools directives resolve --before "$BEFORE" --github-output
      - name: Which tests can this change skip?
        # Only with [[ci.select]] rules. Git has the full history here; an unknown or unresolvable
        # base, or an event other than push and pull_request, leaves nothing deselected.
        id: select
        if: fromJSON(steps.export.outputs.config).select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FORCE_CI: ${{ steps.directives.outputs.force-ci }}
          WOULD_RELEASE: ${{ steps.decide.outputs.released }}
          COMPONENTS: ${{ steps.components.outputs.components }}
        run: |
          # A forced run, or one that could release the root or a component, tests everything.
          if [ "$FORCE_CI" = "true" ] || [ "$WOULD_RELEASE" = "true" ] || { [ -n "$COMPONENTS" ] && [ "$COMPONENTS" != "[]" ]; }; then
            echo "deselect=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "push" ] && { [ -z "$BASE" ] || [ -z "${BASE//0/}" ]; }; then
            BASE="$(git rev-parse --verify -q 'HEAD^1' || true)"
          fi
          deselect="$(ghtools ci select --base "$BASE" --event "$EVENT")"
          echo "deselect=$deselect" >> "$GITHUB_OUTPUT"
      - name: Should CI run?
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          WOULD_RELEASE: ${{ steps.decide.outputs.released }}
          FORCE_CI: ${{ steps.directives.outputs.force-ci }}
          COMPONENTS: ${{ steps.components.outputs.components }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DESELECT: ${{ steps.select.outputs.deselect }}
        run: |
          skip_args=()
          if [ -n "$DESELECT" ]; then skip_args+=(--deselect "$DESELECT"); fi
          if [ "$EVENT" = "pull_request" ] && [ "$(ghtools ci skip-pr --head "$HEAD_REF" --sha "$HEAD_SHA" "${skip_args[@]}")" = "true" ]; then
            echo "run-ci=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" != "push" ] || [ "$WOULD_RELEASE" = "true" ] || [ "$FORCE_CI" = "true" ] || { [ -n "$COMPONENTS" ] && [ "$COMPONENTS" != "[]" ]; }; then
            echo "run-ci=true" >> "$GITHUB_OUTPUT"
          else
            run_ci="$(ghtools ci should-run --base "$BEFORE")"
            echo "run-ci=$run_ci" >> "$GITHUB_OUTPUT"
          fi
      - name: Did code change?
        id: code
        # Codecov uploads only for code changes (ci.paths), so docs and settings changes neither
        # upload nor get a coverage status. A PR compares with its base, a push with the old head.
        # The day (UTC) is fixed here so every leg counts ci.coverage.uploads-per-day against it.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed="$(ghtools ci code-changed --base "$BASE")"
          echo "code-changed=$changed" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: CI matrix for this change
        id: matrix
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          FORCE_CI: ${{ steps.directives.outputs.force-ci }}
          COMPONENTS: ${{ steps.components.outputs.components }}
        run: |
          args=(--base "$BASE" --head "$HEAD" --github-output)
          if [ "$FORCE_CI" = "true" ]; then args+=(--all); fi
          # A component due for release is tested in this run even if this push did not touch it.
          if [ -n "$COMPONENTS" ] && [ "$COMPONENTS" != "[]" ]; then
            mapfile -t due < <(jq -r '.[].name' <<< "$COMPONENTS")
            args+=(--also "${due[@]}")
          fi
          ghtools ci matrix "${args[@]}"
      - name: Did a pull request already test this tree?
        # ci.reuse-pr-results: a push to the default branch whose tree a passing pull request run
        # recorded skips CI; the recorded legs go to the status card instead (uploaded below).
        id: reuse
        if: steps.ref.outputs.default-ref == 'true' && steps.paths.outputs.run-ci == 'true' && steps.directives.outputs.force-ci != 'true' && fromJSON(steps.export.outputs.config).reuse
        env:
          MATRIX: ${{ steps.matrix.outputs.matrix }}
          DESELECT: ${{ steps.select.outputs.deselect }}
          WOULD_RELEASE: ${{ steps.decide.outputs.released }}
          COMPONENTS: ${{ steps.components.outputs.components }}
        run: |
          reuse_args=()
          if [ -n "$DESELECT" ]; then reuse_args+=(--deselect "$DESELECT"); fi
          # A release needs one clean CI run: a local record (long-lived venvs) never covers it.
          if [ "$WOULD_RELEASE" = "true" ] || { [ -n "$COMPONENTS" ] && [ "$COMPONENTS" != "[]" ]; }; then reuse_args+=(--no-local); fi
          reused="$(ghtools ci reuse --matrix "$MATRIX" --out "$RUNNER_TEMP/reused-legs" "${reuse_args[@]}")"
          echo "reused=$reused" >> "$GITHUB_OUTPUT"
          if [ "$reused" = "true" ]; then
            echo "::notice title=CI reused::this tree passed CI on a pull request; tests not re-run"
          fi
      - name: Reused legs for the status card
        if: steps.reuse.outputs.reused == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghtools-status-leg-reused
          path: ${{ runner.temp }}/reused-legs
          retention-days: 1
      - name: Should docs run?
        id: docs-paths
        # docs.paths: only a change touching those globs builds the docs; empty = every run.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          run_docs="$(ghtools ci docs-changed --base "$BASE")"
          echo "run-docs=$run_docs" >> "$GITHUB_OUTPUT"


  # Every job runs inline in this one workflow. A job-level `$/.github/workflows/...` call from here
  # resolves against the CALLER's repository on push and workflow_dispatch (GitHub behaviour measured
  # 2026-09-28), so nested reusable workflows would break every consumer's default-branch runs.
  # Step-level `$/` actions (setup-ghtools) resolve correctly.

  # ---- Python CI: one leg per matrix entry (python versions, runners, or subprojects) ----
  test:
    name: test (${{ matrix.subproject || matrix.python }}, ${{ matrix.runner }})
    needs: config
    if: >-
      needs.config.outputs.run-ci == 'true' &&
      (fromJSON(needs.config.outputs.config).profile == 'python' || fromJSON(needs.config.outputs.config).subprojects) &&
      needs.config.outputs.any == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      # Codecov is on by default; until a repo adds the secret its uploads are skipped, not failed.
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
      # Today's uploads are cache entries named this plus a count, one series per subproject.
      CODECOV_QUOTA: ${{ format('ghtools-codecov-{0}-{1}-', matrix.subproject || 'root', needs.config.outputs.codecov-day) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/.github/actions/setup-ghtools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Access to private git dependencies
        # Set only when ci.private-deps is on (the stub passes DEPS_TOKEN): pip then fetches
        # private GitHub dependencies through it. Both URL forms are rewritten.
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          if [ -n "$DEPS_TOKEN" ]; then
            git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
            git config --global --add url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "git@github.com:"
          fi
      - name: Install
        env:
          SUBPROJECT: ${{ matrix.subproject }}
        run: |
          if [ -n "$SUBPROJECT" ]; then ghtools ci install --subproject "$SUBPROJECT"; else ghtools ci install; fi
      - name: Setup
        # After install: setup commands may import the package (python-dev's downloads,
        # sph-dev's sarracen patches). ci.setup for root legs, a subproject's own otherwise.
        env:
          SUBPROJECT: ${{ matrix.subproject }}
        run: |
          if [ -n "$SUBPROJECT" ]; then ghtools ci setup --subproject "$SUBPROJECT"; else ghtools ci setup; fi
      - name: Gates
        id: gates
        # Umbrella repos run their test-stage gates once, in the lint job.
        if: strategy.job-index == 0 && fromJSON(needs.config.outputs.config).profile == 'python'
        run: |
          ghtools gates install --stage test
          ghtools gates run --stage test
      - name: Test
        id: test
        # Runs even if a gate failed, so coverage and test results always report;
        # the failed gate still fails the job.
        if: ${{ !cancelled() }}
        env:
          SUBPROJECT: ${{ matrix.subproject }}
          DESELECT: ${{ needs.config.outputs.deselect }}
        run: |
          args=()
          if [ -n "$SUBPROJECT" ]; then args+=(--subproject "$SUBPROJECT"); fi
          if [ -n "$DESELECT" ] && [ "$DESELECT" != "[]" ]; then args+=(--deselect "$DESELECT"); fi
          ghtools ci test "${args[@]}"
      - name: Codecov token missing
        if: ${{ !cancelled() && strategy.job-index == 0 && fromJSON(needs.config.outputs.config).codecov && env.HAS_CODECOV_TOKEN != 'true' && needs.config.outputs.code-changed == 'true' }}
        run: >-
          echo "::notice title=Codecov upload skipped::No CODECOV_TOKEN secret in this repository.
          Add one (Codecov > the repo > Configuration > General) to upload coverage and test
          results, or set ci.coverage.codecov = false in .github/ghtools.toml."
      # One leg uploads per run: the first, or each subproject's own. Every upload counts against
      # the Codecov plan's monthly allowance, so ci.coverage.uploads-per-day also caps each day.
      - name: Codecov uploads today
        id: quota-lookup
        if: ${{ !cancelled() && (strategy.job-index == 0 || matrix.subproject) && fromJSON(needs.config.outputs.config).codecov && env.HAS_CODECOV_TOKEN == 'true' && needs.config.outputs.code-changed == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ghtools-codecov
          key: ${{ env.CODECOV_QUOTA }}
          restore-keys: ${{ env.CODECOV_QUOTA }}
          lookup-only: true
      - name: Codecov daily limit
        id: quota
        if: ${{ !cancelled() && (strategy.job-index == 0 || matrix.subproject) && fromJSON(needs.config.outputs.config).codecov && env.HAS_CODECOV_TOKEN == 'true' && needs.config.outputs.code-changed == 'true' }}
        env:
          MATCHED: ${{ steps.quota-lookup.outputs.cache-matched-key }}
        run: |
          ghtools ci codecov-quota --prefix "$CODECOV_QUOTA" --matched "$MATCHED" --github-output
          mkdir -p "$RUNNER_TEMP/ghtools-codecov"
          date -u > "$RUNNER_TEMP/ghtools-codecov/uploaded"
      - name: Upload coverage to Codecov
        id: upload-coverage
        if: ${{ !cancelled() && steps.quota.outputs.upload == 'true' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          flags: ${{ fromJSON(needs.config.outputs.config).flags == 'subproject' && matrix.subproject || (fromJSON(needs.config.outputs.config).flags == 'python-version' && format('py{0}', matrix.python) || '') }}
      - name: Upload test results to Codecov
        id: upload-test-results
        if: ${{ !cancelled() && steps.quota.outputs.upload == 'true' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          disable_search: true
          flags: ${{ fromJSON(needs.config.outputs.config).flags == 'subproject' && matrix.subproject || (fromJSON(needs.config.outputs.config).flags == 'python-version' && format('py{0}', matrix.python) || '') }}
      - name: Record the Codecov upload
        if: >-
          ${{ !cancelled() && steps.quota.outputs.key != '' &&
          (steps.upload-coverage.outcome == 'success' || steps.upload-test-results.outcome == 'success') }}
        continue-on-error: true  # a missed record costs one extra upload, never a failed run
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ghtools-codecov
          key: ${{ steps.quota.outputs.key }}
      - name: Record status leg
        if: ${{ !cancelled() }}
        continue-on-error: true  # status must never fail CI
        env:
          PY: ${{ matrix.python }}
          RUNNER: ${{ matrix.runner }}
          OUTCOME: ${{ steps.test.outcome }}
          GATES: ${{ steps.gates.outcome }}
          CANONICAL: ${{ strategy.job-index == 0 }}
          SUBPROJECT: ${{ matrix.subproject }}
        run: |
          args=(--python "$PY" --runner "$RUNNER" --outcome "$OUTCOME" --gates-outcome "$GATES" --out "$RUNNER_TEMP/status-leg.json")
          if [ "$CANONICAL" = "true" ]; then args+=(--canonical); fi
          if [ -n "$SUBPROJECT" ]; then args+=(--subproject "$SUBPROJECT"); fi
          ghtools status leg "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: ghtools-status-leg-${{ matrix.python }}-${{ matrix.runner }}${{ matrix.subproject && format('-{0}', matrix.subproject) || '' }}
          path: ${{ runner.temp }}/status-leg.json
          retention-days: 1

  tests-passed:
    # One stable check name for branch protection: passes when every selected leg passed,
    # or when nothing needed testing (a docs-only change in an umbrella repo).
    needs: [config, test]
    if: >-
      always() && needs.config.result == 'success' &&
      needs.config.outputs.run-ci == 'true' &&
      (fromJSON(needs.config.outputs.config).profile == 'python' || fromJSON(needs.config.outputs.config).subprojects)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "tests: $RESULT"
          [ "$RESULT" = success ] || [ "$RESULT" = skipped ]

  record-tested:
    # ci.reuse-pr-results: remember that this pull request's tree passed, with its status legs,
    # so the push that merges it can skip CI. Same-repo pull requests only (forks get a read-only
    # token); a failed record only costs a re-run on the push.
    needs: [config, test, tests-passed, docker, hacs-test, hassfest, hacs, lint]
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.config.result == 'success' && needs.tests-passed.result == 'success' &&
      fromJSON(needs.config.outputs.config).reuse &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/.github/actions/setup-ghtools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ghtools-status-leg-*
          path: ${{ runner.temp }}/legs
      - name: Record the tested tree
        env:
          DESELECT: ${{ needs.config.outputs.deselect }}
        run: |
          # With rules, always say which selection the legs ran with ("[]" is a claimed full run).
          args=()
          if [ -n "$DESELECT" ]; then args+=(--deselect "$DESELECT"); fi
          ghtools ci record-tested --legs "$RUNNER_TEMP/legs" "${args[@]}"

  docker:
    needs: config
    if: >-
      needs.config.outputs.run-ci == 'true' &&
      (fromJSON(needs.config.outputs.config).profile == 'python' || fromJSON(needs.config.outputs.config).subprojects) &&
      fromJSON(needs.config.outputs.config).docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t ghtools-ci .

  # ---- HACS integrations ----
  hacs-test:
    needs: config
    if: needs.config.outputs.run-ci == 'true' && fromJSON(needs.config.outputs.config).profile == 'hacs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/.github/actions/setup-ghtools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ fromJSON(needs.config.outputs.config).python_latest }}
      - run: ghtools ci install
      - name: Gates
        id: gates
        run: |
          ghtools gates install --stage test
          ghtools gates run --stage test
      - name: Test
        id: test
        # Runs even if a gate failed, so the test result still reports.
        if: ${{ !cancelled() }}
        run: ghtools ci test
      - name: Record status leg
        if: ${{ !cancelled() }}
        continue-on-error: true  # status must never fail CI
        env:
          PY: ${{ fromJSON(needs.config.outputs.config).python_latest }}
          OUTCOME: ${{ steps.test.outcome }}
          GATES: ${{ steps.gates.outcome }}
        run: >-
          ghtools status leg --python "$PY" --runner ubuntu-latest --outcome "$OUTCOME"
          --gates-outcome "$GATES" --canonical --out "$RUNNER_TEMP/status-leg.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: ghtools-status-leg-hacs
          path: ${{ runner.temp }}/status-leg.json
          retention-days: 1

  hassfest:
    needs: config
    if: needs.config.outputs.run-ci == 'true' && fromJSON(needs.config.outputs.config).profile == 'hacs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93 # master 2026-09-27

  hacs:
    needs: config
    if: needs.config.outputs.run-ci == 'true' && fromJSON(needs.config.outputs.config).profile == 'hacs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration

  # ---- Lint-only and umbrella repos ----
  lint:
    needs: config
    if: >-
      needs.config.outputs.run-ci == 'true' &&
      contains(fromJSON('["lint", "umbrella"]'), fromJSON(needs.config.outputs.config).profile)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/.github/actions/setup-ghtools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Gates
        id: gates
        run: |
          ghtools gates install --stage test
          ghtools gates run --stage test
      - name: Record status leg
        if: ${{ !cancelled() }}
        continue-on-error: true  # status must never fail CI
        env:
          GATES: ${{ steps.gates.outcome }}
        run: >-
          ghtools status leg --python "3.12" --runner ubuntu-latest --outcome "$GATES"
          --gates-outcome "$GATES" --lint-only --out "$RUNNER_TEMP/status-leg.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: ghtools-status-leg-lint
          path: ${{ runner.temp }}/status-leg.json
          retention-days: 1

  # ---- Docs (Sphinx), deployed to Pages from the default branch ----
  docs:
    needs: [config, test, tests-passed, docker, hacs-test, hassfest, hacs, lint]
    if: >-
      always() && needs.config.result == 'success' &&
      fromJSON(needs.config.outputs.config).docs.enabled &&
      needs.config.outputs.run-docs == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOY: >-
        ${{ needs.config.outputs.default-ref == 'true' &&
        fromJSON(needs.config.outputs.config).docs.pages && !inputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: $/.github/actions/setup-ghtools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: System packages
        run: |
          pkgs_out="$(ghtools config get docs.apt)"
          if [ -n "$pkgs_out" ]; then
            mapfile -t pkgs <<<"$pkgs_out"
            sudo apt-get update -qq
            sudo apt-get install -y -qq "${pkgs[@]}"
          fi
      - name: Access to private git dependencies
        # Set only when ci.private-deps is on (the stub passes DEPS_TOKEN): pip then fetches
        # private GitHub dependencies through it. Both URL forms are rewritten.
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          if [ -n "$DEPS_TOKEN" ]; then
            git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
            git config --global --add url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "git@github.com:"
          fi
      - name: Install
        run: ghtools docs install
      - name: Build
        run: ghtools docs build
      - name: Docs gates
        id: gates
        run: |
          ghtools gates install --stage docs
          ghtools gates run --stage docs
      - id: html
        run: |
          dir="$(ghtools docs html-dir)"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: env.DEPLOY == 'true'
        with:
          path: ${{ steps.html.outputs.dir }}
      - name: Record docs status
        if: ${{ !cancelled() }}
        continue-on-error: true  # status must never fail the docs job
        env:
          RESULT: ${{ job.status }}
          GATES: ${{ steps.gates.outcome }}
        run: ghtools status collect docs --result "$RESULT" --coverage-gate "$GATES" --out "$RUNNER_TEMP/status/docs.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: ghtools-status-docs
          path: ${{ runner.temp }}/status/docs.json
          retention-days: 1

  docs-deploy:
    needs: [config, docs]
    # always(): the profile-specific CI jobs upstream of docs are always partly skipped, and a
    # skipped ancestor would otherwise skip this job too.
    if: >-
      always() && needs.docs.result == 'success' &&
      needs.config.outputs.default-ref == 'true' &&
      fromJSON(needs.config.outputs.config).docs.pages && !inputs.dry-run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # ---- Release: version from Conventional Commits, tag, GitHub release ----
  release:
    needs: [config, test, tests-passed, docker, hacs-test, hassfest, hacs, lint]
    if: >-
      always() && needs.config.result == 'success' &&
      needs.config.outputs.default-ref == 'true' &&
      needs.config.outputs.would-release == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.publish.outputs.released || 'false' }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
      dist-artifact: ghtools-dist
      # The release commit this job pushed to the branch; empty when it pushed none.
      commit: ${{ steps.push.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: $/.github/actions/setup-ghtools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Decide
        id: decide
        env:
          # Lets `decide` resume a ghtools tag that an earlier run pushed but never released.
          GH_TOKEN: ${{ github.token }}
        run: ghtools release decide --github-output
      - name: Dry-run summary
        if: inputs.dry-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ghtools release decide --summary >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare the release commit and tag locally
        if: steps.decide.outputs.released == 'true' && steps.decide.outputs.resume != 'true' && !inputs.dry-run
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Assign first: a failing `release prepare` then fails this step instead of being
          # swallowed and releasing a tag whose version file still has the old version.
          changed_out="$(ghtools release prepare "$VERSION")"
          if [ -n "$changed_out" ]; then
            mapfile -t changed <<<"$changed_out"
            git add -- "${changed[@]}"
            git commit -m "chore(release): $TAG [skip ci]"
          fi
          git tag -a "$TAG" -m "Release $TAG"
      - name: Check out the tag to resume
        if: steps.decide.outputs.resume == 'true' && !inputs.dry-run
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: git checkout --detach "$TAG"
      - name: Build
        if: steps.decide.outputs.released == 'true' && !inputs.dry-run
        run: |
          set -euo pipefail
          python -m pip install --quiet build
          ghtools release build --out dist
      - name: Push release commit and tag
        id: push
        if: steps.decide.outputs.released == 'true' && steps.decide.outputs.resume != 'true' && !inputs.dry-run
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          branch="$(ghtools config get branch)"
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            if ! git push origin "HEAD:$branch"; then
              git fetch --quiet origin "$branch"
              if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
                # No rebase: commits pushed after this run started haven't passed this run's CI.
                # The queued run for the newer push releases everything together.
                echo "::notice::$branch moved since this run started, so nothing was released here; the next run releases these commits together."
                echo "pushed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::Pushing the release commit to $branch was rejected. If a ruleset protects $branch, add GitHub Actions to its bypass list or set release.commit = false in .github/ghtools.toml."
              exit 1
            fi
            commit="$(git rev-parse HEAD)"
            echo "commit=$commit" >> "$GITHUB_OUTPUT"
          fi
          git push origin "refs/tags/$TAG"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.decide.outputs.released == 'true' && !inputs.dry-run && (steps.decide.outputs.resume == 'true' || steps.push.outputs.pushed == 'true')
        with:
          name: ghtools-dist
          path: dist/
          if-no-files-found: ignore
      - name: GitHub release
        id: publish
        if: steps.decide.outputs.released == 'true' && !inputs.dry-run && (steps.decide.outputs.resume == 'true' || steps.push.outputs.pushed == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.decide.outputs.version }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          ghtools release notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          args=("$TAG" --title "$TAG" --verify-tag)
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            args+=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            args+=(--generate-notes)
          fi
          case "$TAG" in *-*) args+=(--prerelease) ;; esac
          shopt -s nullglob
          files=(dist/*)
          gh release create "${args[@]}" "${files[@]}"
          echo "released=true" >> "$GITHUB_OUTPUT"

  # Released components (subprojects with release = true): one commit, one annotated tag and one
  # GitHub release each. It needs `release` so the two never push at once: the root release (if
  # any) lands first and this job continues from the branch it pushed. Skipped without components.
  release-components:
    needs: [config, test, tests-passed, docker, hacs-test, hassfest, hacs, lint, release]
    if: >-
      always() && needs.config.result == 'success' &&
      needs.config.outputs.default-ref == 'true' &&
      needs.config.outputs.components != '[]' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # The components' release commit this job pushed to the branch (empty when it pushed none)
      # and the subject decide gave it.
      commit: ${{ steps.push.outputs.commit }}
      commit-message: ${{ steps.decide.outputs.commit-message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: $/.github/actions/setup-ghtools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Continue from the root release commit
        # The root release pushed its commit to the branch after this run started; build on it
        # rather than on GITHUB_SHA so this job's push is a fast-forward.
        if: needs.release.outputs.released == 'true' && !inputs.dry-run
        env:
          ROOT_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          branch="$(ghtools config get branch)"
          git fetch --quiet origin "$branch"
          # Only the root release commit itself: a child of the tested commit whose subject is
          # exactly what the `release` job commits. A user commit pushed since (the root made no
          # commit, e.g. on a resume) never matches. Otherwise stay put: the push below is then
          # rejected and reported as "moved", as for `release`.
          if [ "$(git rev-parse --verify -q 'FETCH_HEAD^' || true)" = "$GITHUB_SHA" ] &&
            [ "$(git log -1 --format=%s FETCH_HEAD)" = "chore(release): $ROOT_TAG [skip ci]" ]; then
            git merge --ff-only FETCH_HEAD
          fi
      - name: Decide
        id: decide
        env:
          # Lets `decide` resume a ghtools tag that an earlier run pushed but never released.
          GH_TOKEN: ${{ github.token }}
        run: ghtools release components decide --github-output
      - name: Dry-run summary
        if: inputs.dry-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ghtools release components decide >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare the release commit and tags locally
        id: prepare
        if: steps.decide.outputs.released == 'true' && !inputs.dry-run
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENTS: ${{ steps.decide.outputs.components }}
          MESSAGE: ${{ steps.decide.outputs.commit-message }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # prepare writes exactly the rows decide exported (it decides nothing again), and never
          # a resume row.
          changed_out="$(ghtools release components prepare --decisions "$COMPONENTS")"
          if [ -n "$changed_out" ]; then
            mapfile -t changed <<<"$changed_out"
            git add -- "${changed[@]}"
            git commit -m "$MESSAGE"
          fi
          while IFS= read -r tag; do
            git tag -a "$tag" -m "Release $tag"
          done < <(jq -r '.[] | select(.resume | not) | .tag' <<<"$COMPONENTS")
      - name: Push release commit and tags
        id: push
        if: steps.decide.outputs.released == 'true' && !inputs.dry-run
        env:
          COMPONENTS: ${{ steps.decide.outputs.components }}
          BASE: ${{ steps.prepare.outputs.base }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -r '.[] | select(.resume | not) | "refs/tags/" + .tag' <<<"$COMPONENTS")
          if [ "${#tags[@]}" -eq 0 ]; then
            # Only resumed releases: their tags are already pushed.
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="$(ghtools config get branch)"
          # One atomic push: the release commit and its tags land together or not at all.
          refs=()
          if [ "$(git rev-parse HEAD)" != "$BASE" ]; then refs+=("HEAD:$branch"); fi
          if ! git push --atomic origin "${refs[@]}" "${tags[@]}"; then
            if [ "${#refs[@]}" -gt 0 ]; then
              git fetch --quiet origin "$branch"
              if [ "$(git rev-parse FETCH_HEAD)" != "$BASE" ]; then
                # No rebase: commits pushed after this run started haven't passed this run's CI.
                # The queued run for the newer push releases everything together.
                echo "::notice::$branch moved since this run started, so no components were released here; the next run releases these commits together."
                echo "pushed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::Pushing the release commit to $branch was rejected. If a ruleset protects $branch, add GitHub Actions to its bypass list or set release.commit = false in .github/ghtools.toml."
            fi
            exit 1
          fi
          if [ "${#refs[@]}" -gt 0 ]; then
            commit="$(git rev-parse HEAD)"
            echo "commit=$commit" >> "$GITHUB_OUTPUT"
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: GitHub releases
        if: steps.decide.outputs.released == 'true' && !inputs.dry-run && steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENTS: ${{ steps.decide.outputs.components }}
        run: |
          set -euo pipefail
          # One row per line: name, version and tag from the exported decision, never re-derived.
          while IFS=$'\t' read -r name version tag; do
            ghtools release components notes "$name" "$version" > "$RUNNER_TEMP/notes.md" </dev/null
            args=("$tag" --title "$name $version" --verify-tag)
            if [ -s "$RUNNER_TEMP/notes.md" ]; then
              args+=(--notes-file "$RUNNER_TEMP/notes.md")
            else
              args+=(--generate-notes)
            fi
            case "$version" in *-*) args+=(--prerelease) ;; esac
            gh release create "${args[@]}" </dev/null
          done < <(jq -r '.[] | [.name, .version, .tag] | @tsv' <<<"$COMPONENTS")

  # ---- docs.after-release: the docs of the release commit this run pushed ----
  # `docs` builds the pushed commit, before `release` and `release-components` commit the new
  # versions and changelogs. With docs.after-release on, these two jobs rebuild the docs from that
  # release commit and redeploy Pages after docs-deploy. Without the key both are skipped.
  docs-release:
    needs: [config, release, release-components]
    if: >-
      always() && needs.config.result == 'success' &&
      needs.config.outputs.default-ref == 'true' &&
      fromJSON(needs.config.outputs.config).docs.enabled &&
      fromJSON(needs.config.outputs.config).docs.pages &&
      fromJSON(needs.config.outputs.config).docs.after_release &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.recheck.outputs.deploy || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: $/.github/actions/setup-ghtools
      - name: Which commit to build?
        id: target
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          ROOT_RESULT: ${{ needs.release.result }}
          COMPONENTS_RESULT: ${{ needs.release-components.result }}
          ROOT_COMMIT: ${{ needs.release.outputs.commit }}
          ROOT_TAG: ${{ needs.release.outputs.tag }}
          COMPONENTS_COMMIT: ${{ needs.release-components.outputs.commit }}
          COMPONENTS_MESSAGE: ${{ needs.release-components.outputs.commit-message }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice title=docs.after-release::dry run, so nothing was released and the docs are not rebuilt"
            exit 0
          fi
          if [ "$ROOT_RESULT" = "failure" ] || [ "$COMPONENTS_RESULT" = "failure" ]; then
            echo "::notice title=docs.after-release::a release job failed, so the docs are not rebuilt from its commit; the site keeps what docs-deploy published"
            exit 0
          fi
          branch="$(ghtools config get branch)"
          git fetch --quiet origin "$branch"
          # Only the exact release commit(s) this run pushed, with the branch still at the newest:
          # each one's parent is GITHUB_SHA or the root release commit, and its subject is the one
          # the release job committed. Anything else prints a notice and leaves commit empty.
          ghtools docs release-commit --base "$GITHUB_SHA" --head FETCH_HEAD \
            --root-commit "$ROOT_COMMIT" --root-tag "$ROOT_TAG" \
            --components-commit "$COMPONENTS_COMMIT" --components-message "$COMPONENTS_MESSAGE" \
            --github-output
      - name: Check out the release commit
        id: checkout
        if: steps.target.outputs.commit != ''
        env:
          COMMIT: ${{ steps.target.outputs.commit }}
          RUN_DOCS: ${{ needs.config.outputs.run-docs }}
        run: |
          set -euo pipefail
          git checkout --quiet --detach "$COMMIT"
          # docs.paths: rebuild only if this push or the release commit touched the docs.
          if [ "$RUN_DOCS" != "true" ]; then
            changed="$(ghtools ci docs-changed --base "$GITHUB_SHA")"
            if [ "$changed" != "true" ]; then
              echo "::notice title=docs.after-release::neither this push nor the release commit touched docs.paths, so the docs are not rebuilt"
              exit 0
            fi
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.checkout.outputs.build == 'true'
        with:
          python-version: "3.12"
      - name: System packages
        if: steps.checkout.outputs.build == 'true'
        run: |
          pkgs_out="$(ghtools config get docs.apt)"
          if [ -n "$pkgs_out" ]; then
            mapfile -t pkgs <<<"$pkgs_out"
            sudo apt-get update -qq
            sudo apt-get install -y -qq "${pkgs[@]}"
          fi
      - name: Access to private git dependencies
        if: steps.checkout.outputs.build == 'true'
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          if [ -n "$DEPS_TOKEN" ]; then
            git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
            git config --global --add url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "git@github.com:"
          fi
      - name: Install
        if: steps.checkout.outputs.build == 'true'
        run: ghtools docs install
      - name: Build
        if: steps.checkout.outputs.build == 'true'
        run: ghtools docs build
      - name: Docs gates
        if: steps.checkout.outputs.build == 'true'
        run: |
          ghtools gates install --stage docs
          ghtools gates run --stage docs
      - id: html
        if: steps.checkout.outputs.build == 'true'
        run: |
          dir="$(ghtools docs html-dir)"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Is the branch still at the release commit?
        # A newer push's own run deploys docs that already include this release; never replace them.
        id: recheck
        if: steps.checkout.outputs.build == 'true'
        env:
          COMMIT: ${{ steps.target.outputs.commit }}
        run: |
          set -euo pipefail
          branch="$(ghtools config get branch)"
          git fetch --quiet origin "$branch"
          head="$(git rev-parse FETCH_HEAD)"
          if [ "$head" != "$COMMIT" ]; then
            echo "::notice title=docs.after-release::$branch moved past the release commit during the build, so this build is not deployed; the newer run's docs include the release"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.recheck.outputs.deploy == 'true'
        with:
          # docs uploads `github-pages` in the same run; artifact names must differ.
          name: github-pages-release
          path: ${{ steps.html.outputs.dir }}

  docs-release-deploy:
    # needs docs-deploy so the pre-release build is published first and this one replaces it;
    # the shared `pages` group orders it against other runs' deploys.
    needs: [config, docs-deploy, docs-release]
    if: >-
      always() && needs.docs-release.result == 'success' &&
      needs.docs-release.outputs.deploy == 'true' &&
      needs.config.outputs.default-ref == 'true' && !inputs.dry-run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-release

  # ---- Status card and badges, published to the status branch ----
  status:
    needs: [config, test, tests-passed, docker, hacs-test, hassfest, hacs, lint, docs, docs-deploy, release, release-components]
    if: >-
      always() && needs.config.result == 'success' &&
      needs.config.outputs.default-ref == 'true' &&
      fromJSON(needs.config.outputs.config).status.enabled && !inputs.dry-run
    runs-on: ubuntu-latest
    # A stale badge is better than a red pipeline: publishing can never fail the run.
    continue-on-error: true
    permissions:
      contents: write
    concurrency:
      group: ghtools-status
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: $/.github/actions/setup-ghtools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ghtools-status-*
          path: ${{ runner.temp }}/status-in
          merge-multiple: false
      - name: Drop the used test record
        if: needs.config.outputs.reused == 'true'
        continue-on-error: true
        run: ghtools ci drop-tested
      - name: Collect and publish
        env:
          VERSION: ${{ needs.release.outputs.released == 'true' && needs.release.outputs.version || '' }}
          GH_TOKEN: ${{ github.token }}
          IN: ${{ runner.temp }}/status-in
          OUT: ${{ runner.temp }}/status-out
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          issues="$(gh api "repos/$GITHUB_REPOSITORY" --jq .open_issues_count 2>/dev/null || true)"
          description="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.description // ""' 2>/dev/null || true)"
          ghtools status collect ci --legs "$IN" --out "$OUT/ci.json"
          project_args=(--version "$VERSION" --description "$description" --out "$OUT/project.json")
          if [ -n "$issues" ]; then project_args+=(--open-issues "$issues"); fi
          ghtools status collect project "${project_args[@]}"
          if [ -f "$IN/ghtools-status-docs/docs.json" ]; then cp "$IN/ghtools-status-docs/docs.json" "$OUT/docs.json"; fi
          ghtools status publish "$OUT"/*.json
